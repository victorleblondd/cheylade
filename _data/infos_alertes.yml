- date: "2026-06-28"
  type: info
  theme: vie
  titre: "Baignade interdite au lac des Cascades"
  resume: "La baignade est strictement interdite au lac des Cascades : elle n'y est pas surveillée et la qualité de l'eau n'est pas conforme à la baignade."
  pdf: "2026-06-28-baignade-interdite-au-lac-des-cascades.pdf"
  texte: |
    <p><strong>Rappel important.</strong> Avec les fortes chaleurs, le lac des Cascades peut donner envie de se rafraîchir. Nous vous rappelons cependant que <strong>la baignade y est strictement interdite</strong> :</p>
    <ul>
      <li>la baignade n'est pas surveillée ;</li>
      <li>la qualité de l'eau n'est pas conforme à la baignade.</li>
    </ul>
    <p>Se baigner dans le lac peut donc présenter un risque pour votre sécurité et votre santé. Merci de respecter cette interdiction et de veiller à la sécurité de tous, notamment des enfants.</p>

