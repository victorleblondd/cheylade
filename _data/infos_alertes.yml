- date: "2026-10-08"
  type: info
  theme: vie
  titre: "Point de collecte : les abords des containers ne sont pas des dépotoirs"
  resume: "Les déchets doivent être déposés dans les containers prévus à cet effet, et non à côté. Quand les containers sont pleins, revenez plus tard ou utilisez les dispositifs adaptés : les encombrants n'ont pas leur place au point de collecte."
  pdf: "2026-10-08-abords-des-containers.pdf"
  texte: |
    <p>Nous constatons actuellement une situation particulièrement dégradée autour du point de collecte de la commune.</p>
    <p>Les déchets doivent <strong>impérativement être déposés dans les containers</strong> prévus à cet effet, et non à côté. Les cartons, sacs, encombrants et autres déchets laissés au sol donnent une image déplorable de notre commune et posent un problème de propreté et d'hygiène.</p>
    <p>Notre point de collecte n'est pas une décharge ! Lorsque les containers sont pleins, merci de ne pas déposer vos déchets à côté : revenez ultérieurement ou utilisez les dispositifs adaptés aux déchets concernés. Les encombrants ne doivent pas être déposés au point de collecte.</p>
    <p>Nous appelons chacun à faire preuve de civisme et à respecter les lieux et le travail des agents qui en assurent l'entretien. Si cette situation devait perdurer, la commune n'exclut pas la mise en place de caméras de surveillance afin d'identifier les dépôts sauvages et de faire respecter les règles.</p>
    <p>La propreté de notre commune est l'affaire de tous. Merci à chacun de contribuer à la préserver.</p>

