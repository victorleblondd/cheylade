- date: "2026-09-21"
  type: info
  theme: travaux
  titre: "Travaux d'assainissement : environ 30 semaines de chantier"
  resume: "Présentés lors de la réunion publique du 17 septembre, les travaux d'assainissement se dérouleront en trois secteurs pendant environ 30 semaines, avec une fin de chantier prévue à l'hiver 2027."
  lien: "/bulletin-municipal/travaux-d-assainissement-et-chantiers-en-cours/"
  lien_texte: "Les travaux en cours dans la commune"
  texte: |
    <p>À la suite de la réunion publique du 17 septembre, en présence du maître d'œuvre, le cabinet Impact Conseil, et de l'entreprise Lacombe, chargée des travaux, les travaux d'assainissement débuteront <strong>début octobre 2026</strong> et s'étaleront sur <strong>environ 30 semaines</strong>, avec une fin de chantier prévue à l'hiver 2027.</p>
    <p>Le chantier se déroulera en plusieurs secteurs :</p>
    <ul>
      <li><strong>secteur 1</strong> (prés en bas de Cheylade) : environ 7 semaines de travaux et 1 semaine d'observation ;</li>
      <li><strong>secteur 2</strong> (le Peuch, route de la Biaugue, rue de Valrhue) : environ 10 semaines de travaux et 2 semaines d'observation ;</li>
      <li><strong>secteur 3</strong> (route du Limon, chemin du Massou) : environ 9 semaines de travaux et 1 semaine d'observation.</li>
    </ul>
    <p>Ces différentes étapes tiennent notamment compte des contraintes liées aux récoltes, aux conditions hivernales et à l'activité agricole.</p>
    <p>Des fermetures ou modifications de circulation pourront être nécessaires selon l'avancement du chantier. Les habitants seront informés des différentes phases et des éventuelles perturbations au fur et à mesure. Les particuliers concernés par le raccordement de leur habitation seront prochainement contactés afin de préciser les modalités à prévoir.</p>
    <p>Merci à tous pour votre compréhension et votre patience pendant cette période de travaux.</p>

- date: "2026-08-22"
  type: info
  theme: vie
  titre: "Chenilles processionnaires : les bons gestes"
  resume: "Rappel des principales mesures de l'arrêté préfectoral : évitez tout contact avec les chenilles et leurs nids, et signalez leur présence sur la plateforme dédiée."
  pdf: "2026-08-22-chenilles-processionnaires.pdf"
  texte: |
    <p>Rappel des principales mesures de l'arrêté préfectoral. Afin de protéger la santé de tous, chacun est invité à <strong>signaler la présence de chenilles processionnaires</strong> sur la plateforme dédiée : <a href="https://signalement-chenilles-processionnaires.atlasante.fr">signalement-chenilles-processionnaires.atlasante.fr</a>.</p>
    <p>Les poils des chenilles peuvent provoquer des réactions importantes chez l'homme et les animaux. Restons vigilants et évitons tout contact avec les nids ou les chenilles.</p>
    <ul>
      <li><strong>En cas de piqûre ou de contact</strong> : éloignez-vous de la zone à risque, prenez une douche et changez de vêtements, sans frotter la peau ni les yeux ; rincez abondamment à l'eau claire les yeux ou la bouche en cas de projection ; en cas de réaction importante, consultez rapidement un professionnel de santé ou appelez le 15.</li>
      <li><strong>Au quotidien</strong> : n'approchez pas des pins ou des arbres infestés, tenez vos chiens en laisse, portez des manches longues, un pantalon et des lunettes lors des activités en pleine nature, et lavez vos vêtements à 60 °C au moins après une promenade en zone à risque.</li>
    </ul>
    <p>Ne touchez jamais les chenilles ni les nids, même s'ils sont au sol.</p>

- date: "2026-07-28"
  type: info
  theme: vie
  titre: "Fin des paiements par chèque pour les factures communales"
  resume: "Les chèques ne seront bientôt plus acceptés pour régler les factures communales (cantine, eau, loyers, fermages, estives, camping…). Privilégiez le prélèvement automatique, le paiement en ligne PayFiP ou le paiement chez un buraliste partenaire."
  pdf: "2026-07-28-fin-des-paiements-par-cheque.pdf"
  texte: |
    <p>Dans le cadre de la modernisation des moyens de paiement et afin de renforcer la sécurité des transactions, <strong>les paiements par chèque ne seront bientôt plus acceptés</strong> pour le règlement des factures communales (cantine, eau, loyers, fermages, estives, camping, etc.).</p>
    <p>Nous vous invitons à privilégier les solutions de paiement suivantes :</p>
    <ul>
      <li>le <strong>prélèvement automatique</strong>, sur demande ;</li>
      <li>le <strong>paiement en ligne</strong> sur <a href="https://www.payfip.gouv.fr/">PayFiP</a> ;</li>
      <li>le <strong>paiement de proximité</strong> chez les buralistes partenaires agréés, en espèces jusqu'à 300 € ou par carte bancaire.</li>
    </ul>
    <p>Ces moyens de paiement sont plus simples, plus rapides et plus sécurisés. Pour toute question, ou pour être accompagné dans vos démarches, contactez la mairie.</p>

